name: Translate and Release

on:
  push:
    branches: [master]
    paths:
      - "src/main/resources/assets/**/lang/**"
      - "src/main/resources/assets/gtladditions/guides/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: translate-release
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.translate.outputs.changed }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Metadados da versao
        id: meta
        run: |
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-build_${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versao: ${VERSION} | Tag: ${TAG}"

      - name: Detectar e traduzir alteracoes de idioma (DeepSeek)
        id: translate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 scripts/translate.py
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma traducao pendente — build/release serao pulados."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar traducoes
        if: steps.translate.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(i18n): sincronizar traducoes en_us <-> zh_cn via DeepSeek"
          git push origin HEAD:master

  build-release:
    runs-on: ubuntu-latest
    needs: translate
    if: |
      always() && needs.translate.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.translate.outputs.changed == 'true')
    steps:
      - name: Checkout (pos-traducao)
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache da distribuicao do Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-dist-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-dist-

      - name: Cache do Loom (Minecraft processado e mods remapeados)
        uses: actions/cache@v4
        with:
          path: .gradle/loom-cache
          key: ${{ runner.os }}-loom-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-loom-

      - name: Configurar Gradle (cache de dependencias e de build)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Permissao de execucao ao gradlew
        run: chmod +x gradlew

      - name: Build do JAR (com Build Scan)
        env:
          GITHUB_ACTION_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          DEVELOCITY_TERMS_OF_USE_AGREE: "yes"
          GRADLE_TERMS_OF_USE_AGREE: "yes"
        run: ./gradlew build -x spotlessCheck --no-daemon --scan -Pkotlin.compiler.execution.strategy=in-process

      - name: Localizar JAR
        id: jar
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v -E 'sources|dev|slim' | head -n 1)
          echo "jar=${JAR_FILE}" >> "$GITHUB_OUTPUT"
          echo "Jar: ${JAR_FILE}"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.translate.outputs.tag }}
          name: GTLAdditions ${{ needs.translate.outputs.version }} (build ${{ github.run_number }})
          body: |
            Build automatica apos sincronizacao de traducoes (en_us <-> zh_cn) via DeepSeek.

            - Commit: ${{ github.sha }}
            - Trigger: ${{ github.event_name }}
          files: ${{ steps.jar.outputs.jar }}
          prerelease: false
          fail_on_unmatched_files: true
